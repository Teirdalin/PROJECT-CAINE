[Runtime]
; PROJECT CAINE loads through the existing native loader with normal game startup.
; Restart the game after changing this. Optional mods have their own CFG.
Enabled=1

[Menu]
; Modern main/pause menus, settings, save/load and Mods. Set 0 for native menus.
Modern=1

[Updates]
; Background GitHub checks. Click Update Available to download, install and restart.
; Saves, current configuration, and independently installed mods are preserved.
Check=1
; Include development releases while CAINE is in development. Set 0 for stable only.
Preview=1
IntervalHours=6

[Startup]
; Skip the four publisher/developer logo videos with any normal launcher.
; Existing configurations use this default when absent. No video files removed.
SkipVideos=1

[Intro]
; Opening cinematic: hold Escape to reach Jack's tutorial using the native skip.
Enabled=1
; 500-5000 ms. Release Escape to cancel; Alt-Tab/pause resets the hold.
HoldMilliseconds=1500

[Crash]
; Detailed local reports. Existing configurations use these defaults when absent.
Enabled=1
Dump=1
; Severe first-chance exceptions may be handled normally. Bound reports per launch.
MaxReports=16
